# Checks every pull request (as it would be merged) and every commit on main.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o siemlite .
      - name: Web UI script
        run: |
          python3 -c "import re,sys; s=open('web/static/index.html').read(); sys.stdout.write(re.findall(r'<script>(.*?)</script>', s, re.S)[-1])" > ui.js
          node --check ui.js

  load:
    name: Load and fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A small version of the load suite (loadtest/doc.go); its floors only
      # catch large slowdowns, since runners vary.
      - name: Load
        run: SIEMLITE_LOAD=ci go test ./loadtest -run Load -v -timeout 15m
      - name: Fuzz
        run: |
          for target in pkg/parser:FuzzParseLine pkg/parser:FuzzPattern pkg/parser:FuzzDraftPattern \
              pkg/syslogd:FuzzReadFrame pkg/backup:FuzzBackupName pkg/intel:FuzzNormalize pkg/intel:FuzzParseFeed; do
            go test "./${target%%:*}" -run '^$' -fuzz "^${target##*:}\$" -fuzztime 20s
          done

  e2e:
    name: Browser test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o siemlite .
          CGO_ENABLED=0 go build -o loggen ./cmd/loggen
      - name: Install Playwright
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright==1.63.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Click through the UI
        run: .venv/bin/python e2e/ui_test.py ./siemlite ./loggen

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip when there is no Dockerfile yet
        id: has
        run: echo "dockerfile=$([ -f Dockerfile ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.has.outputs.dockerfile == 'yes'
      - name: Build
        if: steps.has.outputs.dockerfile == 'yes'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
