# Deploy or upgrade with: git pull && docker compose up -d --build
# Settings go in .env (copy .env.example). Data lives in the siemlite-data volume.
services:
  siemlite:
    build: .
    image: siemlite:local
    restart: unless-stopped
    command:
      - -addr=0.0.0.0:8443
      - -syslog-udp=:5514
      - -syslog-tcp=:5514
      - -syslog-tls=:6514
    env_file:
      - path: .env
        required: false
    ports:
      - "${SIEMLITE_BIND:-}:${SIEMLITE_HTTPS_PORT:-8443}:8443"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/udp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/tcp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_TLS_PORT:-6514}:6514"
    volumes:
      - siemlite-data:/data
      # Optional GeoIP databases; set SIEMLITE_GEOIP_CITY=/geoip/<file>.mmdb in .env.
      - ./geoip:/geoip:ro
    # SIEMLite flushes queued events on shutdown; allow time for that.
    stop_grace_period: 20s

  # Optional local AI model for parser suggestions. Turn it on with
  # COMPOSE_PROFILES=ai and SIEMLITE_AI_URL=http://ollama:11434 in .env.
  # Only SIEMLite can reach it; no port is published.
  ollama:
    image: ollama/ollama
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  siemlite-data:
  ollama-models:
