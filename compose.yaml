# Deploy or upgrade with: git pull && docker compose up -d --build
# Settings go in .env (copy .env.example). Data lives in the siemlite-data volume.
services:
  siemlite:
    build: .
    # Set SIEMLITE_IMAGE=ghcr.io/justwaters/siemlite:<version> in .env to run a
    # prebuilt release (docker compose pull && docker compose up -d) instead.
    image: ${SIEMLITE_IMAGE:-siemlite:local}
    restart: unless-stopped
    command:
      - -addr=0.0.0.0:8443
      - -syslog-udp=:5514
      - -syslog-tcp=:5514
      - -syslog-tls=:6514
    env_file:
      - path: .env
        required: false
    ports:
      - "${SIEMLITE_BIND:-}:${SIEMLITE_HTTPS_PORT:-8443}:8443"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/udp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/tcp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_TLS_PORT:-6514}:6514"
    volumes:
      - siemlite-data:/data
      # Optional GeoIP databases; set SIEMLITE_GEOIP_CITY=/geoip/<file>.mmdb in .env.
      - ./geoip:/geoip:ro
    # SIEMLite flushes queued events on shutdown; allow time for that.
    stop_grace_period: 20s

  # Optional local AI model for parser suggestions. Turn it on with
  # COMPOSE_PROFILES=ai and SIEMLITE_AI_URL=http://ollama:11434 in .env.
  # Only SIEMLite can reach it; no port is published.
  ollama:
    image: ollama/ollama
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # Optional test logs, sent continuously at LOGGEN_EPS events a second (default
  # 10) for as long as it runs, through a restart or an upgrade of SIEMLite.
  # Turn it on with COMPOSE_PROFILES=testlogs (or ai,testlogs) in .env, then
  # docker compose up -d. It sends with the Log generator token SIEMLite made
  # on first start. See "Test logs" in the README.
  loggen:
    image: ${SIEMLITE_IMAGE:-siemlite:local}
    profiles: [testlogs]
    restart: unless-stopped
    depends_on:
      siemlite:
        condition: service_healthy
    entrypoint: [loggen]
    # SIEMLite's certificate names localhost, so check it against that name.
    # loggen finds the token and certificate in /data. If SIEMLite is down or
    # restarting it keeps trying and carries on when it is back.
    command: ["-eps=${LOGGEN_EPS:-10}", "-report=1m", "-to=https://siemlite:8443", "-servername=localhost"]
    healthcheck:
      disable: true
    volumes:
      - siemlite-data:/data:ro

volumes:
  siemlite-data:
  ollama-models:
